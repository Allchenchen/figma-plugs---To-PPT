<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To PPT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      height: 552px;
      overflow: hidden;
      background: #FFFCF9;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Segoe UI", sans-serif;
      font-weight: 400;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      padding: 20px 24px 0;
    }

    h1 {
      font-size: 18px;
      font-weight: 510;
      line-height: 20px;
      color: #333;
      margin-bottom: 14px;
    }

    .chip-box {
      position: relative;
      height: 184px;
      border: 1px solid #D2BAA4;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .empty {
      padding: 22px 16px 16px;
      font-size: 13px;
      font-weight: 400;
      line-height: 16px;
      color: #666;
    }

    .chips {
      height: 152px;
      margin: 16px 16px 0;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    .chips.is-overflow {
      overflow-y: auto;
      scrollbar-width: none;
    }

    .chips.fade-bottom {
      -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 28px), transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 28px), transparent 100%);
    }

    .chips.fade-top {
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 100%);
    }

    .chips.fade-top.fade-bottom {
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
    }

    .chips::-webkit-scrollbar { width: 0; height: 0; }

    .chip-scroll {
      position: absolute;
      top: 40px;
      right: 6px;
      width: 2px;
      height: 50px;
      border-radius: 100px;
      background: #D2BAA4;
      pointer-events: none;
    }

    .chip-scroll[hidden] { display: none; }

    .chip {
      height: 36px;
      padding: 0 20px;
      border-radius: 100px;
      background: #EDE3D9;
      color: #4F4F4F;
      font-size: 12px;
      font-weight: 400;
      line-height: 36px;
      white-space: nowrap;
    }

    h2 {
      font-size: 18px;
      font-weight: 510;
      line-height: 20px;
      color: #333;
      margin-bottom: 14px;
    }

    .modes {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .mode {
      position: relative;
      width: 160px;
      height: 60px;
      border: 1px solid #D2BAA4;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .mode input {
      position: absolute;
      opacity: 0;
      inset: 0;
      margin: 0;
      cursor: pointer;
    }

    .mode svg { width: 16px; height: 16px; display: block; flex: none; }
    .mode .radio-on { display: none; }
    .mode:has(input:checked) .radio-on { display: block; }
    .mode:has(input:checked) .radio-off { display: none; }

    .mode-label { font-size: 13px; font-weight: 400; line-height: 16px; color: #666; }
    .mode:has(input:checked) .mode-label { color: #333; }

    .hint {
      font-size: 11px;
      font-weight: 400;
      line-height: 16px;
      color: #828282;
    }

    .hint + .hint { margin-top: 4px; }

    #export {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 332px;
      height: 60px;
      margin-top: 32px;
      border: none;
      border-radius: 100px;
      background: #ED4832;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 510;
      line-height: 19px;
      cursor: pointer;
    }

    #export:disabled { cursor: not-allowed; }

    .status {
      margin-top: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #333;
      font-size: 13px;
      font-weight: 400;
      line-height: 13px;
    }

    .status svg { width: 16px; height: 16px; display: block; flex: none; }
    .status svg[hidden] { display: none; }
    .status[hidden] { display: none; }

    .status .icon-exporting {
      width: 16px;
      height: 16px;
      display: block;
      flex: none;
      transform-origin: center;
      will-change: transform;
      animation: exporting-spin 2.5s linear infinite;
    }

    .status .icon-exporting[hidden] { display: none; }

    @keyframes exporting-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .status .icon-exporting { animation: none; }
    }
  </style>
</head>
<body>
  <h1 id="selection-title">0 frames selected</h1>

  <div class="chip-box">
    <p id="empty" class="empty">Please select at least one frame.</p>
    <div id="chips" class="chips" hidden></div>
    <div id="chip-scroll" class="chip-scroll" hidden></div>
  </div>

  <h2>Export mode</h2>
  <div class="modes">
    <label class="mode">
      <input type="radio" name="strategy" value="editable" checked />
      <svg class="radio-on" preserveAspectRatio="none" overflow="visible" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M15.5 8C15.5 12.1421 12.1421 15.5 8 15.5C3.85786 15.5 0.5 12.1421 0.5 8C0.5 3.85786 3.85786 0.5 8 0.5C12.1421 0.5 15.5 3.85786 15.5 8Z" fill="#ED4832" stroke="#ED4832"/>
        <circle cx="8" cy="8" r="3.33333" fill="white"/>
      </svg>
      <svg class="radio-off" preserveAspectRatio="none" overflow="visible" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M15 8C15 11.866 11.866 15 8 15C4.13401 15 1 11.866 1 8C1 4.13401 4.13401 1 8 1C11.866 1 15 4.13401 15 8Z" stroke-width="2" stroke="#D2BAA4"/>
      </svg>
      <span class="mode-label">Editable PPT</span>
    </label>
    <label class="mode">
      <input type="radio" name="strategy" value="fidelity" />
      <svg class="radio-on" preserveAspectRatio="none" overflow="visible" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M15.5 8C15.5 12.1421 12.1421 15.5 8 15.5C3.85786 15.5 0.5 12.1421 0.5 8C0.5 3.85786 3.85786 0.5 8 0.5C12.1421 0.5 15.5 3.85786 15.5 8Z" fill="#ED4832" stroke="#ED4832"/>
        <circle cx="8" cy="8" r="3.33333" fill="white"/>
      </svg>
      <svg class="radio-off" preserveAspectRatio="none" overflow="visible" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M15 8C15 11.866 11.866 15 8 15C4.13401 15 1 11.866 1 8C1 4.13401 4.13401 1 8 1C11.866 1 15 4.13401 15 8Z" stroke-width="2" stroke="#D2BAA4"/>
      </svg>
      <span class="mode-label">Image-based PPT</span>
    </label>
  </div>

  <p class="hint">* Editable PPT: Keep text, shapes, and images editable.</p>
  <p class="hint">* Image-based PPT: Each frame becomes a full-slide 2× PNG.</p>

  <input type="hidden" name="size" value="frame" />

  <button id="export" type="button" disabled>Export to PowerPoint</button>
